<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Feed Sign Up</title>

    <style>
        * {
            margin: 0;
        }

        body {
            background: rgb(120, 96, 64);
        }

        #formContainer {
            width: 400px;
            margin: 30px auto;
            background-color: white;
            border: 8px solid #123C83;
            border-radius: 25px;
            overflow: hidden;
            position: relative;
        }

        #closeBtn {
            position: absolute;
            top: 10px;
            left: 10px;
            cursor: pointer;
            z-index: 2;
        }

        #formContainer header {
            background-image: url("images/jesus_feeds_5000.jpeg");
            background-size: cover;
            background-position: top;
            height: 130px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding-top: 45px;
            color: white;
            text-align: center;
            text-shadow: 1.5px 1.5px 1px black;
        
        }

        #formContainer header h1 {
            font-size: 35px;
            font-weight: bold;
        }

        #formContainer header h2 {
            font-size: 30px;
            font-weight: 200;
        }

        #formContainer h3 {
            padding-top: 20px;
            font-size: 20px;
            text-align: center;
        }
        
        #myForm {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            padding: 20px;
            align-items: center;
        }

        #myForm label {
            font-size: 16px;
            font-weight: bold;
        }

        #myForm input[type="text"],
        #myForm input[type="password"],
        #myForm input[type="email"] {
            width: 100%;
            box-sizing: border-box;
            padding: 5px;
        }

        
        #myForm section {
            grid-column: 1 / 3;
            text-align: center;
        }

        #myForm section input {
            margin-right: 5px;
        }

        #myForm button[type="submit"] {
            padding: 8px 20px;
            background-color: white;
            border: 1px solid gray;
            border-radius: 4px;
            cursor: pointer;
        }

        #myForm button[type="submit"]:hover {
            background-color: #DCE8F2;
        }

        .scripture-images {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            width: 100%;
            gap: 5px;
        }

        .scripture-images img {
            width: 100%;
            height: 100px;
            object-fit: cover;
            display: block;
        }




    </style>




</head>

<body>
    <div id="formContainer">
        <header>
            <h1>Daily Feed</h1>
            <h2>Scripture a Day</h2>
        </header>

        <h3>Sign Up for Daily Scripture Feed</h3>
        <form id="myForm">
            <button type="button" id="closeBtn">X</button>
            <label for="username">User Name:</label>
            <input type="text" id="username" name="username" required>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label>Gender:</label>
            <div>
                <input type="radio" id="male" name="gender" value="male" required>
                <label for="male">Male</label>
                <input type="radio" id="female" name="gender" value="female" required>
                <label for="female">Female</label>
            </div>

            <section>
                <input type="checkbox" id="newsletter" name="newsletter">
                <label for="newsletter">Subscribe to newsletter</label>
            </section>

            <section>
                <input type="checkbox" id="conditions" name="conditions" required>
                <label for="conditions">I acknowledge the terms and conditions</label>
            </section>

            <section>
                <button type="submit">Submit</button>
            </section>
        </form>

        
        <div class="scripture-images">
            <img src="images/old_testament.WEBP" alt="Old Testament">
            <img src="images/new_testament.WEBP" alt="New Testament">
            <img src="images/book_of_mormon.WEBP" alt="Book of Mormon">
            <img src="images/doctrine_and_covenants.WEBP" alt="Doctrine and Covenants">
            <img src="images/pearl_of_great_price.WEBP" alt="Pearl of Great Price">
        </div>

    </div>

    <div id="output"></div>

    <script>
        // Here is some Javascript to start looking forward to wdd131
        document.getElementById("closeBtn").addEventListener("click", function () {
            document.getElementById("formContainer").style.display = "none";
         });
        const form = document.getElementById('myForm');
        const output = document.getElementById('output');

        form.addEventListener('submit', function (event) {
            event.preventDefault(); // Stop form from actually submitting

            const formData = new FormData(form);
            const entries = [];

            for (const [key, value] of formData.entries()) {
                if (key == "password") {
                    entries.push(`<strong>${key}</strong>: ${value} (you should probably encrypt the password)`);
                } else {
                    entries.push(`<strong>${key}</strong>: ${value}`);
                }
            }

            output.innerHTML = `
            <br>  
            <h3>Here is the data that would be sent to the server:</h3>
            <ul>
                ${entries.map(item => `<li>${item}</li>`).join('')}
            </ul>
            `;
                });
    </script>

</body>

</html>
